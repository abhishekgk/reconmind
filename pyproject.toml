[project]
name = "reconmind"
version = "0.1.0"
description = "Open-source, local-LLM recon orchestrator for learning security research"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "pydantic>=2.6",
    "anthropic>=0.40",
]

[project.scripts]
reconmind = "reconmind.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["reconmind*"]

[tool.setuptools.package-data]
"reconmind.server" = ["static/*"]
